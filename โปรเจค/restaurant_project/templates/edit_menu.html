{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-200 mt-4">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">✏️ แก้ไขเมนูอาหาร</h2>
        <a href="/" class="text-xs text-slate-500 hover:text-indigo-600 font-medium flex items-center gap-1">⬅️ กลับหน้าหลัก</a>
    </div>
    <form method="POST" action="/edit_menu/{{ item.id }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700">ชื่อเมนูอาหาร</label>
            <input type="text" name="name" value="{{ item.name }}" required class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">หมวดหมู่</label>
            <select name="category" required class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                {% for cat in categories %}
                <option value="{{ cat }}" {% if cat == item.category %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">ราคา (บาท)</label>
            <input type="number" step="0.01" name="price" value="{{ item.price }}" required class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">URL รูปภาพอาหาร</label>
            <input type="url" name="image_url" value="{{ item.image_url }}" class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex items-center gap-2 pt-2">
            <input type="checkbox" id="is_available" name="is_available" {% if item.is_available %}checked{% endif %} class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
            <label for="is_available" class="text-sm font-medium text-slate-700">พร้อมจำหน่าย (Available)</label>
        </div>
        <div class="flex gap-3 pt-4">
            <a href="/" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-center font-bold py-2.5 rounded-lg transition">ยกเลิก</a>
            <button type="submit" class="w-1/2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2.5 rounded-lg shadow transition">บันทึกการแก้ไข</button>
        </div>
    </form>
</div>
{% endblock %}
