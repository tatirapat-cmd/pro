{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-200 mt-4">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">➕ เพิ่มเมนูอาหารใหม่</h2>
        <a href="/" class="text-xs text-slate-500 hover:text-indigo-600 font-medium flex items-center gap-1">⬅️ กลับหน้าหลัก</a>
    </div>
    <form method="POST" action="/add_menu" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700">ชื่อเมนูอาหาร</label>
            <input type="text" name="name" placeholder="เช่น กุ้งแช่น้ำปลา, ข้าวผัดกุ้ง" required class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">หมวดหมู่</label>
            <select name="category" required class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                <option value="" disabled selected>-- เลือกหมวดหมู่ --</option>
                <option value="อาหารเรียกน้ำย่อย / ของทานเล่น (Appetizers / Starters)">อาหารเรียกน้ำย่อย / ของทานเล่น (Appetizers / Starters)</option>
                <option value="อาหารจานหลัก (Main Courses)">อาหารจานหลัก (Main Courses)</option>
                <option value="อาหารจานเดียว / ข้าวและเส้น (Single Dishes / Rice & Noodles)">อาหารจานเดียว / ข้าวและเส้น (Single Dishes / Rice & Noodles)</option>
                <option value="อาหารประเภทกับข้าว (Shared Dishes)">อาหารประเภทกับข้าว (Shared Dishes)</option>
                <option value="ของหวาน (Desserts)">ของหวาน (Desserts)</option>
                <option value="เครื่องดื่ม (Beverages)">เครื่องดื่ม (Beverages)</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">ราคา (บาท)</label>
            <input type="number" step="0.01" name="price" placeholder="60.00" required class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">URL รูปภาพอาหาร</label>
            <input type="url" name="image_url" placeholder="https://images.unsplash.com/..." class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            <p class="text-xs text-slate-400 mt-1">*สามารถนำลิงก์รูปภาพจากอินเทอร์เน็ตมาวางได้</p>
        </div>
        <div class="flex gap-3 pt-4">
            <a href="/" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-center font-bold py-2.5 rounded-lg transition">ยกเลิก</a>
            <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow transition">บันทึกเมนู</button>
        </div>
    </form>
</div>
{% endblock %}
